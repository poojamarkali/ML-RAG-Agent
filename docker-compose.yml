services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ml
      POSTGRES_PASSWORD: ml
      POSTGRES_DB: ml_metrics
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ml -d ml_metrics"]
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql+psycopg://ml:ml@postgres:5432/ml_metrics
    ports: ["8000:8000"]
    volumes:
      - ./data/documents:/app/data/documents
      - hf_cache:/root/.cache          # downloaded embedding / reranker models
    depends_on:
      qdrant: {condition: service_started}
      postgres: {condition: service_healthy}

  ui:
    build: .
    command: ["python", "-m", "streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]

volumes:
  qdrant_data:
  postgres_data:
  hf_cache:
