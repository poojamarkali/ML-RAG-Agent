[project]
name = "ml-rag-ai-agent"
version = "0.1.0"
description = "Agentic RAG over ML PDFs + SQL: Qdrant hybrid search, re-ranking, FastAPI, MCP, evaluation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "qdrant-client>=1.11.0",
    "sentence-transformers>=3.0.0",
    "torch>=2.2.0",
    "pypdf>=4.3.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-aws>=0.2.0",
    "boto3>=1.34.0",
    "langsmith>=0.1.99",
    "mcp>=1.0.0",
    "sqlalchemy>=2.0.30",
    "streamlit>=1.38.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "langchain-qdrant>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "langchain-community>=0.4.2",
    "langchain-experimental>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "psycopg[binary]>=3.3.6",
    "fastembed>=0.8.1",
]

# Linux (Docker) gets the CPU-only torch build -- the default pulls GBs of CUDA libraries
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

